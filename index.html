<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Franco Morini G30 - Suzuki Wolf & RMX 50</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.4);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 5px;
        }

        header h1 {
            font-size: 1.6rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .grid-configs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        select, input[type="range"] {
            width: 100%;
            padding: 8px;
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .val-display {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: bold;
            text-align: right;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        .dash-panel {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: rgba(15, 23, 42, 0.8);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .dash-item {
            display: flex;
            flex-direction: column;
        }

        .dash-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .dash-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--text);
        }

        .powerband-light {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            background: #334155;
            color: #64748b;
            transition: all 0.1s ease;
        }

        .powerband-light.active {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 12px var(--accent);
        }

        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            background: #334155;
            color: var(--text);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: var(--accent);
            color: #000;
        }

        .btn-gear {
            background: #1e293b;
            border: 1px solid var(--border);
        }

        .gears-container {
            display: flex;
            gap: 5px;
            justify-content: center;
        }

        .gear-btn {
            flex: 1;
            padding: 8px;
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .gear-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Franco Morini G30 Simulator</h1>
        <p>Suzuki Wolf 50 & RMX 50 - Banco de Ensaio & Condução Real</p>
    </header>

    <!-- SECÇÃO 1: BANCO DE ENSAIO -->
    <div class="card">
        <h2>Banco de Ensaio (Dyno)</h2>
        <div class="grid-configs">
            <div class="control-group">
                <label>Modelo / Ciclo</label>
                <select id="bikeModel" onchange="updateSimConfig()">
                    <option value="wolf">Suzuki Wolf 50 (Estrada)</option>
                    <option value="rmx">Suzuki RMX 50 (Enduro)</option>
                </select>
            </div>
            <div class="control-group">
                <label>Escape</label>
                <select id="exhaustSelect" onchange="updateSimConfig()">
                    <option value="stock">Origem / Desrestrito</option>
                    <option value="voca">VOCA Rookie 50/70</option>
                    <option value="yasuni">Yasuni R3</option>
                    <option value="macal">Macal M90 Artesanal</option>
                </select>
            </div>
            <div class="control-group">
                <label>Carburador</label>
                <select id="carbSelect" onchange="updateSimConfig()">
                    <option value="sha14">Dellorto SHA 14mm</option>
                    <option value="phbg19">Dellorto PHBG 19mm</option>
                    <option value="pwk26">Stage6 PWK 26mm</option>
                </select>
            </div>
            <div class="control-group">
                <label>Ignição / Rotor</label>
                <select id="ignitionSelect" onchange="updateSimConfig()">
                    <option value="stock">Origem (Volante Pesado)</option>
                    <option value="mvt">Rotor Interno MVT / PVL</option>
                    <option value="prog">Digital Programável</option>
                </select>
            </div>
            <div class="control-group">
                <label>Squish: <span id="squishVal">0.80</span> mm</label>
                <input type="range" id="squishInput" min="0.50" max="1.20" step="0.05" value="0.80" oninput="updateSimConfig()">
            </div>
            <div class="control-group">
                <label>Diag. Escape: <span id="exhaustPortVal">185</span>°</label>
                <input type="range" id="exhaustPortInput" min="170" max="200" step="1" value="185" oninput="updateSimConfig()">
            </div>
        </div>
    </div>

    <!-- GRÁFICO DYNO -->
    <div class="card">
        <div class="canvas-container">
            <canvas id="dynoCanvas" width="860" height="260"></canvas>
        </div>
    </div>

    <!-- SECÇÃO 2: SIMULADOR DE ANDAMENTO -->
    <div class="card">
        <h2>Simulador em Andamento</h2>
        
        <div class="canvas-container" style="margin-top: 10px;">
            <canvas id="rideCanvas" width="860" height="240"></canvas>
        </div>

        <div class="dash-panel" style="margin-top: 15px;">
            <div class="dash-item">
                <span class="dash-label">Velocidade</span>
                <span class="dash-value"><span id="speedVal">0</span> <small>km/h</small></span>
            </div>
            <div class="dash-item">
                <span class="dash-label">Rotação</span>
                <span class="dash-value"><span id="rpmVal">1500</span> <small>RPM</small></span>
            </div>
            <div class="dash-item">
                <span class="dash-label">Mudança</span>
                <span class="dash-value" id="gearDisplay">N</span>
            </div>
            <div class="dash-item">
                <span class="dash-label">Estado</span>
                <div id="powerbandLight" class="powerband-light">POWERBAND</div>
            </div>
        </div>

        <div style="margin-top: 15px;">
            <label style="margin-bottom: 5px; display:block;">Caixa de Velocidades</label>
            <div class="gears-container">
                <button class="gear-btn" onclick="setGear(0)">N</button>
                <button class="gear-btn" onclick="setGear(1)">1</button>
                <button class="gear-btn" onclick="setGear(2)">2</button>
                <button class="gear-btn" onclick="setGear(3)">3</button>
                <button class="gear-btn" onclick="setGear(4)">4</button>
                <button class="gear-btn" onclick="setGear(5)">5</button>
                <button class="gear-btn" onclick="setGear(6)">6</button>
            </div>
        </div>

        <div class="actions-grid" style="margin-top: 15px;">
            <button class="btn btn-gear" onclick="shiftGear(-1)">Reduzir [-]</button>
            <button class="btn btn-gear" onclick="shiftGear(1)">Subir [+]</button>
        </div>

        <div style="margin-top: 15px;">
            <button id="throttleBtn" class="btn btn-primary" style="width: 100%; padding: 18px; font-size: 1.1rem;"
                ontouchstart="setThrottle(1)" ontouchend="setThrottle(0)"
                onmousedown="setThrottle(1)" onmouseup="setThrottle(0)"
                onmouseleave="setThrottle(0)">
                MANTER ACELERADOR (SEGURAR OU ESPAÇO)
            </button>
        </div>
    </div>
</div>

<script>
    // Configurações do Motor e Simulação
    let config = {
        model: 'wolf',
        exhaust: 'voca',
        carb: 'pwk26',
        ignition: 'mvt',
        squish: 0.80,
        exhaustPort: 185,
        peakRpm: 10500,
        maxHp: 13.5,
        maxTorque: 8.2
    };

    let physics = {
        rpm: 1500,
        speed: 0, // km/h
        gear: 0, // 0 = Neutral, 1-6
        throttle: 0,
        wheelieAngle: 0,
        distance: 0,
        clutch: 1.0
    };

    // Relações de transmissão G30 (Primária + 6 mudanças)
    const gearRatios = [0, 3.12, 2.05, 1.50, 1.20, 1.00, 0.85];
    const primaryRatio = 3.75;
    const finalDrive = 3.6; // Pinhão/Coroa
    const wheelCircumference = 1.85; // metros (roda 17")

    // Áudio Web API
    let audioCtx = null;
    let osc = null;
    let gainNode = null;
    let audioInitialized = false;

    function initAudio() {
        if (audioInitialized) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            osc = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(40, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            audioInitialized = true;
        } catch (e) {
            console.log('Áudio não suportado ou bloqueado.');
        }
    }

    function updateAudio() {
        if (!audioInitialized || !audioCtx) return;
        try {
            let targetFreq = 30 + (physics.rpm / 125) * (config.ignition === 'mvt' ? 1.1 : 1.0);
            if (physics.throttle > 0.1) {
                targetFreq += Math.random() * 4; // vibração 2T
            }
            osc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.05);
            
            let targetGain = 0.0;
            if (physics.rpm > 1200) {
                targetGain = 0.03 + (physics.throttle * 0.07) + (physics.rpm > 8000 ? 0.04 : 0);
            }
            gainNode.gain.setTargetAtTime(targetGain, audioCtx.currentTime, 0.05);
        } catch (e) {}
    }

    function updateSimConfig() {
        config.model = document.getElementById('bikeModel').value;
        config.exhaust = document.getElementById('exhaustSelect').value;
        config.carb = document.getElementById('carbSelect').value;
        config.ignition = document.getElementById('ignitionSelect').value;
        config.squish = parseFloat(document.getElementById('squishInput').value);
        config.exhaustPort = parseInt(document.getElementById('exhaustPortInput').value);

        document.getElementById('squishVal').innerText = config.squish.toFixed(2);
        document.getElementById('exhaustPortVal').innerText = config.exhaustPort;

        // Cálculo dinâmico de potência baseada nos mods
        let baseHp = 9.0;
        if (config.exhaust === 'voca') baseHp += 3.5;
        if (config.exhaust === 'yasuni') baseHp += 4.0;
        if (config.exhaust === 'macal') baseHp += 2.5;

        if (config.carb === 'phbg19') baseHp += 1.0;
        if (config.carb === 'pwk26') baseHp += 2.2;

        if (config.squish <= 0.75) baseHp += 0.8;
        if (config.exhaustPort >= 190) {
            baseHp += 1.2;
            config.peakRpm = 11500;
        } else if (config.exhaustPort <= 180) {
            config.peakRpm = 9500;
        } else {
            config.peakRpm = 10500;
        }

        config.maxHp = baseHp;
        config.maxTorque = baseHp * 0.65;

        drawDyno();
    }

    function setThrottle(val) {
        initAudio();
        physics.throttle = val;
    }

    function setGear(g) {
        physics.gear = g;
        document.getElementById('gearDisplay').innerText = g === 0 ? 'N' : g;
        
        let btns = document.querySelectorAll('.gear-btn');
        btns.forEach((b, idx) => {
            if (idx === g) b.classList.add('active');
            else b.classList.remove('active');
        });
    }

    function shiftGear(dir) {
        let newGear = physics.gear + dir;
        if (newGear >= 0 && newGear <= 6) {
            setGear(newGear);
        }
    }

    // Atalhos de Teclado
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            initAudio();
            physics.throttle = 1.0;
            e.preventDefault();
        }
        if (e.code === 'ArrowUp' || e.code === 'KeyS') {
            shiftGear(1);
        }
        if (e.code === 'ArrowDown' || e.code === 'KeyA') {
            shiftGear(-1);
        }
    });

    window.addEventListener('keyup', (e) => {
        if (e.code === 'Space') {
            physics.throttle = 0;
            e.preventDefault();
        }
    });

    // Desenhar Banco de Ensaio (Dyno)
    const dynoCanvas = document.getElementById('dynoCanvas');
    const ctxDyno = dynoCanvas.getContext('2d');

    function drawDyno() {
        ctxDyno.clearRect(0, 0, dynoCanvas.width, dynoCanvas.height);

        // Fundo e grelha
        ctxDyno.fillStyle = '#0f172a';
        ctxDyno.fillRect(0, 0, dynoCanvas.width, dynoCanvas.height);

        ctxDyno.strokeStyle = '#334155';
        ctxDyno.lineWidth = 1;
        for (let i = 0; i < dynoCanvas.width; i += 60) {
            ctxDyno.beginPath();
            ctxDyno.moveTo(i, 0);
            ctxDyno.lineTo(i, dynoCanvas.height);
            ctxDyno.stroke();
        }
        for (let j = 0; j < dynoCanvas.height; j += 40) {
            ctxDyno.beginPath();
            ctxDyno.moveTo(0, j);
            ctxDyno.lineTo(dynoCanvas.width, j);
            ctxDyno.stroke();
        }

        // Curva de Potência e Binário
        ctxDyno.beginPath();
        ctxDyno.lineWidth = 3;
        ctxDyno.strokeStyle = '#f59e0b';

        let maxRpm = 13000;
        for (let rpm = 2000; rpm <= maxRpm; rpm += 200) {
            let ratio = rpm / config.peakRpm;
            let hp = config.maxHp * Math.sin(ratio * Math.PI * 0.75) * (rpm < 4000 ? (rpm / 4000) : 1);
            if (hp < 0) hp = 0;

            let x = ((rpm - 2000) / (maxRpm - 2000)) * (dynoCanvas.width - 60) + 40;
            let y = dynoCanvas.height - 30 - (hp / 18) * (dynoCanvas.height - 50);

            if (rpm === 2000) ctxDyno.moveTo(x, y);
            else ctxDyno.lineTo(x, y);
        }
        ctxDyno.stroke();

        // Texto informativo no dyno
        ctxDyno.fillStyle = '#f8fafc';
        ctxDyno.font = 'bold 13px sans-serif';
        ctxDyno.fillText(`Potência Máx: ${config.maxHp.toFixed(1)} CV @ ${config.peakRpm} RPM`, 50, 30);
        ctxDyno.fillText(`Squish: ${config.squish}mm | Escape: ${config.exhaustPort}°`, 50, 50);
    }

    // Desenhar Simulação de Condução e Física
    const rideCanvas = document.getElementById('rideCanvas');
    const ctxRide = rideCanvas.getContext('2d');

    function updatePhysics() {
        // Inércia da ignição
        let inertia = config.ignition === 'mvt' ? 0.35 : 0.8;

        let idleRpm = 1500;
        let maxRpmLimit = 12500;

        if (physics.gear === 0) {
            // Em ponto morto
            let targetRpm = idleRpm + physics.throttle * (maxRpmLimit - idleRpm);
            physics.rpm += (targetRpm - physics.rpm) * (0.2 / inertia);
            physics.speed *= 0.96; // desacelera por atrito
            physics.wheelieAngle *= 0.8;
        } else {
            // Engatado
            let gearRatio = gearRatios[physics.gear];
            let totalRatio = primaryRatio * gearRatio * finalDrive;
            
            // Velocidade teórica com base no RPM
            let wheelRps = (physics.rpm / 60) / totalRatio;
            let currentSpeedKmh = wheelRps * wheelCircumference * 3.6;

            if (physics.throttle > 0) {
                let targetRpm = idleRpm + physics.throttle * (maxRpmLimit - idleRpm);
                physics.rpm += (targetRpm - physics.rpm) * (0.1 / inertia);
                
                // Força de aceleração baseada na powerband
                let inPowerband = physics.rpm >= 7500 && physics.rpm <= 11500;
                let torqueFactor = inPowerband ? 1.3 : 0.6;
                
                let acceleration = (config.maxTorque * torqueFactor * physics.throttle * (7 / physics.gear)) / inertia;
                physics.speed += acceleration * 0.08;

                // Cavalinho (Wheelie) em 1ª e 2ª na powerband
                if ((physics.gear === 1 || physics.gear === 2) && inPowerband && physics.throttle > 0.8) {
                    physics.wheelieAngle = Math.min(0.35, physics.wheelieAngle + 0.03);
                } else {
                    physics.wheelieAngle *= 0.9;
                }
            } else {
                // Travnagem de motor
                physics.speed *= 0.98;
                physics.rpm -= 200;
                physics.wheelieAngle *= 0.85;
            }

            // Resistência aerodinâmica e atrito do modelo
            let aeroDrag = config.model === 'wolf' ? 0.0003 : 0.0005;
            physics.speed -= (physics.speed * physics.speed) * aeroDrag;

            if (physics.speed < 0) physics.speed = 0;

            // Recalcular RPM com base na velocidade real da roda
            let calculatedRpm = (physics.speed / 3.6 / wheelCircumference) * totalRatio * 60;
            if (calculatedRpm < idleRpm) calculatedRpm = idleRpm;
            
            physics.rpm = physics.rpm * 0.8 + calculatedRpm * 0.2;
            if (physics.rpm > maxRpmLimit) physics.rpm = maxRpmLimit;
        }

        physics.distance += (physics.speed / 3.6) * 0.02;

        // Atualizar UI
        document.getElementById('speedVal').innerText = Math.round(physics.speed);
        document.getElementById('rpmVal').innerText = Math.round(physics.rpm);

        let powerbandLight = document.getElementById('powerbandLight');
        if (physics.rpm >= 7500 && physics.rpm <= 11500) {
            powerbandLight.classList.add('active');
        } else {
            powerbandLight.classList.remove('active');
        }

        updateAudio();
        drawRideScene();
        requestAnimationFrame(updatePhysics);
    }

    function drawRideScene() {
        ctxRide.clearRect(0, 0, rideCanvas.width, rideCanvas.height);

        // Fundo (Céu e Estrada)
        ctxRide.fillStyle = '#1e293b';
        ctxRide.fillRect(0, 0, rideCanvas.width, 140);
        ctxRide.fillStyle = '#0f172a';
        ctxRide.fillRect(0, 140, rideCanvas.width, 100);

        // Linhas da estrada em movimento
        ctxRide.strokeStyle = '#64748b';
        ctxRide.lineWidth = 4;
        ctxRide.beginPath();
        let offset = (physics.distance * 15) % 40;
        for (let x = -40 - offset; x < rideCanvas.width; x += 40) {
            ctxRide.moveTo(x, 190);
            ctxRide.lineTo(x + 20, 190);
        }
        ctxRide.stroke();

        // Desenhar Mota (Wolf vs RMX)
        ctxRide.save();
        let bikeX = 220;
        let bikeY = 145;

        // Efeito de Cavalinho
        ctxRide.translate(bikeX, bikeY);
        ctxRide.rotate(-physics.wheelieAngle);
        ctxRide.translate(-bikeX, -bikeY);

        if (config.model === 'wolf') {
            // Suzuki Wolf 50 (Estilo Estrada / Ciclomotor desportivo)
            // Rodas liga leve
            ctxRide.strokeStyle = '#cbd5e1';
            ctxRide.lineWidth = 5;
            ctxRide.beginPath();
            ctxRide.arc(bikeX - 55, bikeY + 25, 22, 0, Math.PI * 2);
            ctxRide.arc(bikeX + 55, bikeY + 25, 22, 0, Math.PI * 2);
            ctxRide.stroke();

            // Quadro e Carenagem
            ctxRide.fillStyle = '#ef4444'; // Vermelho Suzuki / azul
            ctxRide.beginPath();
            ctxRide.moveTo(bikeX - 40, bikeY + 15);
            ctxRide.lineTo(bikeX + 30, bikeY + 15);
            ctxRide.lineTo(bikeX + 15, bikeY - 20);
            ctxRide.lineTo(bikeX - 25, bikeY - 15);
            ctxRide.closePath();
            ctxRide.fill();

            // Cúpula / Farol dianteiro
            ctxRide.fillStyle = '#f8fafc';
            ctxRide.fillRect(bikeX + 25, bikeY - 15, 12, 18);
        } else {
            // Suzuki RMX 50 (Enduro / Trail com rodas maiores e suspensão alta)
            bikeY -= 8; // mais alta
            // Rodas de raios grandes
            ctxRide.strokeStyle = '#94a3b8';
            ctxRide.lineWidth = 4;
            ctxRide.beginPath();
            ctxRide.arc(bikeX - 60, bikeY + 28, 26, 0, Math.PI * 2);
            ctxRide.arc(bikeX + 60, bikeY + 28, 26, 0, Math.PI * 2);
            ctxRide.stroke();

            // Guarda-lamas alto Enduro
            ctxRide.fillStyle = '#f8fafc';
            ctxRide.beginPath();
            ctxRide.moveTo(bikeX + 40, bikeY + 5);
            ctxRide.lineTo(bikeX + 80, bikeY - 5);
            ctxRide.stroke();

            // Corpo RMX
            ctxRide.fillStyle = '#2563eb'; // Azul Suzuki Enduro
            ctxRide.fillRect(bikeX - 35, bikeY - 10, 75, 22);
        }

        ctxRide.restore();
    }

    // Inicialização
    updateSimConfig();
    requestAnimationFrame(updatePhysics);
</script>

</body>
</html>
